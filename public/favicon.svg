<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark blue background -->
  <rect width="100" height="100" fill="#0a0a5e" rx="12"/>

  <!-- Open book - left page -->
  <path d="M50 72 Q35 68 20 72 L20 42 Q35 38 50 44 Z" fill="#00c070" opacity="0.85"/>
  <!-- Open book - right page -->
  <path d="M50 72 Q65 68 80 72 L80 42 Q65 38 50 44 Z" fill="#4de8a0" opacity="0.9"/>
  <!-- Book spine shadow -->
  <path d="M50 44 L50 72" stroke="#00a050" stroke-width="1.5" fill="none"/>

  <!-- Graduation cap - board -->
  <rect x="32" y="26" width="36" height="5" rx="1.5" fill="#111111" transform="rotate(-5 50 28.5)"/>
  <!-- Graduation cap - top -->
  <polygon points="50,18 34,27 50,31 66,27" fill="#222222"/>
  <!-- Tassel string -->
  <line x1="58" y1="28" x2="58" y2="40" stroke="#333333" stroke-width="1.2"/>
  <!-- Tassel -->
  <rect x="55.5" y="40" width="5" height="6" rx="1" fill="#333333"/>
</svg>
